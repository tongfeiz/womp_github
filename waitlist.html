<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Waitlist - womp</title>
    <link rel="icon" type="image/x-icon" href="images/womplogo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        @media (prefers-reduced-motion: no-preference) {
            html {
                scroll-behavior: smooth;
            }
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #030303;
            color: #eaeaea;
            line-height: 1.6;
            letter-spacing: -0.2px;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px;
            padding-left: 30px;
            max-width: 1200px;
            margin: 0 auto;
            margin-top: 22px;
            border-radius: 25px;
            background: rgba(31, 31, 31, 0.55);
            backdrop-filter: blur(16px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            color: #eaeaea;
            text-decoration: none;
        }

        .logo img {
            width: 24px;
            height: 24px;
            transform-origin: 50% 50%;
        }

        @keyframes logoDance {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
            25%  { transform: translate3d(0px, -1px, 0) rotate(-5deg) scale(1.02); }
            50%  { transform: translate3d(0px, 1px, 0) rotate(4deg) scale(1.01); }
            75%  { transform: translate3d(0px, -0.5px, 0) rotate(-3deg) scale(1.01); }
            100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
        }

        .logo:hover img {
            animation: logoDance 500ms ease-in-out both;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            background: transparent;
            border: none;
            color: #eaeaea;
            font-size: 16px;
            font-weight: 400;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            padding: 8px 22px;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .nav-button {
            background: #FF7434;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            padding: 16px 28px;
            border-radius: 15px;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .nav-button:hover {
            opacity: 0.7;
        }

        /* Waitlist Form Section */
        .waitlist-container {
            padding: 120px 40px 80px;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .waitlist-container.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        .waitlist-title {
            font-size: 42px;
            font-weight: 700;
            color: #eaeaea;
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        .waitlist-subtitle {
            font-size: 18px;
            font-weight: 400;
            color: #A0A0A0;
            text-align: center;
            margin-bottom: 48px;
            letter-spacing: -0.2px;
        }

        .waitlist-form {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .waitlist-form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.08) 0.5px, transparent 0),
                radial-gradient(circle at 3px 3px, rgba(0, 0, 0, 0.15) 0.5px, transparent 0);
            background-size: 4px 4px, 2px 2px;
            background-position: 0 0, 1px 1px;
            pointer-events: none;
            opacity: 0.4;
        }

        .form-group {
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .form-label {
            display: block;
            font-size: 16px;
            font-weight: 400;
            color: #eaeaea;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: #030303;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #eaeaea;
            font-size: 16px;
            font-weight: 400;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            letter-spacing: -0.2px;
        }

        .form-input:focus {
            outline: none;
            border-color: #FF7434;
            background: #0a0a0a;
        }

        .form-input::placeholder {
            color: #808080;
        }

        .submit-button {
            width: 100%;
            background: #FF7434;
            color: #ffffff;
            border: none;
            padding: 16px 28px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 400;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: -0.2px;
            margin-top: 8px;
        }

        .submit-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .form-message {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: 400;
            position: relative;
            z-index: 1;
            display: none;
        }

        .form-message.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #4CAF50;
            display: block;
        }

        .form-message.error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
            display: block;
        }

        /* Footer */
        .footer {
            padding: 60px 10px 120px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            overflow: visible;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .footer.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        .footer-stars {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            margin-top: -13%;
        }

        .footer-stars img {
            width: 100%;
            height: auto;
            display: block;
        }

        .footer-divider {
            border-top: 1px solid #333333;
            margin: 20px 0 40px;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 60px;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-copyright {
            font-size: 14px;
            font-weight: 400;
            color: #A0A0A0;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: 400;
            color: #A0A0A0;
        }

        .footer-links a {
            color: #A0A0A0;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #eaeaea;
        }

        .footer-social {
            display: flex;
            gap: 12px;
        }

        .social-icon, .social-icon2 {
            width: 32px;
            height: 32px;
            background: #222222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eaeaea;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .social-icon:hover, .social-icon2:hover {
            background: #333333;
        }

        .social-icon img {
            width: 14px;
            height: 14px;
            display: block;
        }

        .social-icon2 img {
            width: 18px;
            height: 14px;
            display: block;
        }

        .footer-logo {
            text-align: center;
            font-size: 300px;
            font-weight: 700;
            color: #ffffff;
            opacity: 0.12;
            margin-top: -100px;
            padding: 0;
            margin-bottom: -100px;
            line-height: 1.2;
            height: auto;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.8) 35%, rgba(0, 0, 0, 0.3) 60%, rgba(0, 0, 0, 0.1) 85%, transparent 100%);
            overflow: visible;
            pointer-events: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 8px 8px;
                padding-left: 20px;
                width: 90%;
            }

            .logo {
                font-size: 20px;
            }

            .logo img {
                width: 28px;
                height: 28px;
            }

            .waitlist-container {
                padding: 100px 32px 60px;
                max-width: 85%;
            }

            .waitlist-title {
                font-size: 32px;
            }

            .waitlist-subtitle {
                font-size: 16px;
                margin-bottom: 32px;
            }

            .waitlist-form {
                padding: 32px 24px;
            }

            .footer {
                padding: 60px 32px 100px;
            }

            .footer-content {
                flex-direction: column;
                gap: 24px;
                align-items: center;
                text-align: center;
            }

            .footer-logo {
                font-size: 27vw;
                margin-top: -60px;
                margin-bottom: -60px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 8px 12px;
                padding-left: 16px;
                width: calc(100% - 24px);
                margin-left: 12px;
                margin-right: 12px;
            }

            .logo {
                font-size: 16px;
            }

            .logo img {
                width: 24px;
                height: 24px;
            }

            .nav-actions {
                gap: 6px;
            }

            .nav-link {
                font-size: 14px;
                padding: 6px 12px;
            }

            .nav-button {
                font-size: 13px;
                padding: 8px 16px;
                white-space: nowrap;
            }

            .waitlist-container {
                padding: 80px 20px 50px;
                max-width: 100%;
            }

            .waitlist-title {
                font-size: 28px;
                margin-bottom: 12px;
            }

            .waitlist-subtitle {
                font-size: 15px;
                margin-bottom: 28px;
            }

            .waitlist-form {
                padding: 24px 20px;
            }

            .form-group {
                margin-bottom: 24px;
            }

            .form-label {
                font-size: 15px;
                margin-bottom: 10px;
            }

            .form-input {
                padding: 14px 18px;
                font-size: 15px;
            }

            .submit-button {
                padding: 14px 24px;
                font-size: 16px;
            }

            .footer {
                padding: 50px 24px 80px;
            }

            .footer-copyright {
                font-size: 12px;
            }

            .footer-links {
                font-size: 12px;
                flex-direction: column;
                gap: 12px;
            }

            .footer-logo {
                font-size: 80px;
                margin-top: -40px;
                margin-bottom: -40px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="index.html" class="logo">
            <img src="images/womplogo.png" alt="Womp Logo">
            womp
        </a>
        <div class="nav-actions">
            <a href="https://youtu.be/Cxjafizhais" target="_blank" class="nav-link">Trailer</a>
            <a href="waitlist.html" style="text-decoration: none;">
                <button class="nav-button">Join Waitlist</button>
            </a>
        </div>
    </header>

    <!-- Waitlist Form Section -->
    <section class="waitlist-container">
        <h1 class="waitlist-title">Join the Waitlist</h1>
        <p class="waitlist-subtitle">Be among the first to experience womp.</p>
        
        <form class="waitlist-form" id="waitlistForm">
            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    class="form-input" 
                    placeholder="Enter your name" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="age" class="form-label">Age</label>
                <input 
                    type="number" 
                    id="age" 
                    name="age" 
                    class="form-input" 
                    placeholder="Enter your age" 
                    min="1" 
                    max="120" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="Enter your email" 
                    required
                >
            </div>
            
            <button type="submit" class="submit-button" id="submitButton">
                Join Waitlist
            </button>
            
            <div class="form-message" id="formMessage"></div>
            
            <!-- Hidden iframe for form submission -->
            <iframe name="hiddenFrame" style="display: none;"></iframe>
        </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-stars">
            <img src="images/starsfooter.png" alt="Stars decorative banner">
        </div>
        <div class="footer-divider"></div>
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-copyright">© 2025 womp | <a href="terms-privacy.html" style="color: #A0A0A0; text-decoration: none; transition: color 0.3s ease;">Terms & Privacy</a></div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="https://x.com/wompalarm" target="_blank">Story</a>
                    <a href="waitlist.html">Waitlist</a>
                </div>
            </div>
            <div class="footer-social">
                <a class="social-icon2" href="mailto:contact@womp.systems" target="_blank" rel="noopener noreferrer" aria-label="Email">
                    <img src="images/mailicon.png" alt="Email icon">
                </a>
                <a class="social-icon" href="https://x.com/wompalarm" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
                    <img src="images/twittericon.png" alt="Twitter icon">
                </a>
            </div>
        </div>
        <div class="footer-logo">womp</div>
    </footer>

    <script>
        // Fade-in animation on load
        window.addEventListener('load', function() {
            const container = document.querySelector('.waitlist-container');
            const footer = document.querySelector('.footer');
            setTimeout(function() {
                if (container) container.classList.add('fade-in');
                if (footer) footer.classList.add('fade-in');
            }, 120);
        });

        // Form submission handling
        const form = document.getElementById('waitlistForm');
        const submitButton = document.getElementById('submitButton');
        const formMessage = document.getElementById('formMessage');
        const hiddenFrame = document.querySelector('iframe[name="hiddenFrame"]');
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbyMWaZJVn0lWbtaz1RgCWGU7pH636QDyd03e-AUymXAyx8SVDpporbcij5-0igKCWc/exec';

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default form submission
            
            // Validate before submission
            const name = document.getElementById('name').value.trim();
            const age = document.getElementById('age').value.trim();
            const email = document.getElementById('email').value.trim();
            
            if (!name || !email) {
                formMessage.textContent = 'Please fill in all required fields.';
                formMessage.className = 'form-message error';
                formMessage.style.display = 'block';
                return;
            }
            
            // Disable button and show loading state
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';
            formMessage.className = 'form-message';
            formMessage.style.display = 'none';
            
            // Build URL with query parameters
            const params = new URLSearchParams({
                name: name,
                age: age,
                email: email
            });
            const url = scriptUrl + '?' + params.toString();
            
            // Log the URL for debugging (check browser console)
            console.log('Submitting to URL:', url);
            
            // Load the URL in the iframe
            hiddenFrame.src = url;
            
            // Listen for the iframe load to detect when submission is complete
            hiddenFrame.addEventListener('load', function onLoad() {
                // Remove the listener to avoid multiple triggers
                hiddenFrame.removeEventListener('load', onLoad);
                
                // Show success message after a short delay
                setTimeout(function() {
                    formMessage.textContent = 'Thank you! You\'ve been added to the waitlist.';
                    formMessage.className = 'form-message success';
                    formMessage.style.display = 'block';
                    form.reset();
                    
                    // Re-enable button
                    submitButton.disabled = false;
                    submitButton.textContent = 'Join Waitlist';
                }, 500);
            }, { once: true });
        });
    </script>
</body>
</html>
